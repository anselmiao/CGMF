
name: CGMF G2 Build

on:
  push:
    branches:
      - qi/g2-neutron-transition-history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dcgmf.tests=ON

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure
        continue-on-error: false

      - name: Run G2 neutron sidecar smoke test
        run: |
          set -o pipefail
          mkdir -p build/g2-sidecar-smoke
          (
            cd build/g2-sidecar-smoke
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-smoke" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 0.0 -i 98252 -s 1 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 200 --run-id ci-g2-smoke \
              | tee sidecar-summary.txt
          )

      - name: Compare sidecar off/on outputs
        run: |
          set -euo pipefail
          mkdir -p build/g2-sidecar-off
          (
            cd build/g2-sidecar-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 0.0 -i 98252 -s 1 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-sidecar-baseline
          (
            cd build/g2-sidecar-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 0.0 -i 98252 -s 1 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-sidecar-smoke/histories.cgmf.0 \
              build/g2-sidecar-off/histories.cgmf.0
          cmp build/g2-sidecar-smoke/sidecar-on.stdout \
              build/g2-sidecar-off/sidecar-off.stdout
          cmp build/g2-sidecar-smoke/rng-audit.tsv \
              build/g2-sidecar-off/rng-audit.tsv
          cmp build/g2-sidecar-smoke/histories.cgmf.0 \
              build/g2-sidecar-baseline/histories.cgmf.0
          cmp build/g2-sidecar-smoke/sidecar-on.stdout \
              build/g2-sidecar-baseline/baseline.stdout
          echo "PASS: sidecar off/on RNG call counts and return digests match; audit-enabled output matches no-audit baseline" \
            | tee build/g2-sidecar-smoke/off-on-comparison.txt

      - name: Run G2 neutron sidecar neutron-induced U-235 test
        run: |
          set -euo pipefail
          mkdir -p build/g2-u235-on
          (
            cd build/g2-u235-on
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-u235-0p5" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 0.5 -i 92235 -s 1 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 200 --run-id ci-g2-u235-0p5 \
              | tee sidecar-summary.txt
          )
          mkdir -p build/g2-u235-off
          (
            cd build/g2-u235-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 0.5 -i 92235 -s 1 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-u235-baseline
          (
            cd build/g2-u235-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 0.5 -i 92235 -s 1 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-u235-on/histories.cgmf.0 build/g2-u235-off/histories.cgmf.0
          cmp build/g2-u235-on/sidecar-on.stdout build/g2-u235-off/sidecar-off.stdout
          cmp build/g2-u235-on/rng-audit.tsv build/g2-u235-off/rng-audit.tsv
          cmp build/g2-u235-on/histories.cgmf.0 build/g2-u235-baseline/histories.cgmf.0
          cmp build/g2-u235-on/sidecar-on.stdout build/g2-u235-baseline/baseline.stdout
          echo "PASS: U-235 0.5 MeV sidecar off/on RNG and baseline outputs match" \
            | tee build/g2-u235-on/off-on-comparison.txt

      - name: Run G2 neutron sidecar thermal-neutron U-235 test
        run: |
          set -euo pipefail
          # 0.0253 eV thermal neutron = 2.53e-8 MeV (CGMF CLI uses MeV).
          mkdir -p build/g2-u235-thermal-on
          (
            cd build/g2-u235-thermal-on
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-u235-thermal-0p0253eV" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 92235 -s 1 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 200 --run-id ci-g2-u235-thermal-0p0253eV \
              | tee sidecar-summary.txt
          )
          mkdir -p build/g2-u235-thermal-off
          (
            cd build/g2-u235-thermal-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 92235 -s 1 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-u235-thermal-baseline
          (
            cd build/g2-u235-thermal-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 92235 -s 1 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-u235-thermal-on/histories.cgmf.0 build/g2-u235-thermal-off/histories.cgmf.0
          cmp build/g2-u235-thermal-on/sidecar-on.stdout build/g2-u235-thermal-off/sidecar-off.stdout
          cmp build/g2-u235-thermal-on/rng-audit.tsv build/g2-u235-thermal-off/rng-audit.tsv
          cmp build/g2-u235-thermal-on/histories.cgmf.0 build/g2-u235-thermal-baseline/histories.cgmf.0
          cmp build/g2-u235-thermal-on/sidecar-on.stdout build/g2-u235-thermal-baseline/baseline.stdout
          echo "PASS: U-235 thermal 0.0253 eV sidecar off/on RNG and baseline outputs match" \
            | tee build/g2-u235-thermal-on/off-on-comparison.txt

      - name: Run G2 neutron sidecar thermal U-235 second-seed test
        run: |
          set -euo pipefail
          # Independent event-seed window: 201..400.
          mkdir -p build/g2-u235-thermal-seed201-on
          (
            cd build/g2-u235-thermal-seed201-on
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-u235-thermal-seed201" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 92235 -s 201 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 400 --run-id ci-g2-u235-thermal-seed201 \
              | tee sidecar-summary.txt
          )
          mkdir -p build/g2-u235-thermal-seed201-off
          (
            cd build/g2-u235-thermal-seed201-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 92235 -s 201 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-u235-thermal-seed201-baseline
          (
            cd build/g2-u235-thermal-seed201-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 92235 -s 201 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-u235-thermal-seed201-on/histories.cgmf.0 build/g2-u235-thermal-seed201-off/histories.cgmf.0
          cmp build/g2-u235-thermal-seed201-on/sidecar-on.stdout build/g2-u235-thermal-seed201-off/sidecar-off.stdout
          cmp build/g2-u235-thermal-seed201-on/rng-audit.tsv build/g2-u235-thermal-seed201-off/rng-audit.tsv
          cmp build/g2-u235-thermal-seed201-on/histories.cgmf.0 build/g2-u235-thermal-seed201-baseline/histories.cgmf.0
          cmp build/g2-u235-thermal-seed201-on/sidecar-on.stdout build/g2-u235-thermal-seed201-baseline/baseline.stdout
          echo "PASS: U-235 thermal second-seed sidecar off/on RNG and baseline outputs match" \
            | tee build/g2-u235-thermal-seed201-on/off-on-comparison.txt

      - name: Run G2 neutron sidecar thermal-neutron Pu-239 test
        run: |
          set -euo pipefail
          # Pu-239 neutron-induced fission is supported by CGMF; 0.0253 eV = 2.53e-8 MeV.
          mkdir -p build/g2-pu239-thermal-on
          (
            cd build/g2-pu239-thermal-on
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-pu239-thermal-0p0253eV" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 94239 -s 1 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 200 --run-id ci-g2-pu239-thermal-0p0253eV \
              | tee sidecar-summary.txt
          )
          mkdir -p build/g2-pu239-thermal-off
          (
            cd build/g2-pu239-thermal-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 94239 -s 1 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-pu239-thermal-baseline
          (
            cd build/g2-pu239-thermal-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 94239 -s 1 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-pu239-thermal-on/histories.cgmf.0 build/g2-pu239-thermal-off/histories.cgmf.0
          cmp build/g2-pu239-thermal-on/sidecar-on.stdout build/g2-pu239-thermal-off/sidecar-off.stdout
          cmp build/g2-pu239-thermal-on/rng-audit.tsv build/g2-pu239-thermal-off/rng-audit.tsv
          cmp build/g2-pu239-thermal-on/histories.cgmf.0 build/g2-pu239-thermal-baseline/histories.cgmf.0
          cmp build/g2-pu239-thermal-on/sidecar-on.stdout build/g2-pu239-thermal-baseline/baseline.stdout
          echo "PASS: Pu-239 thermal 0.0253 eV sidecar off/on RNG and baseline outputs match" \
            | tee build/g2-pu239-thermal-on/off-on-comparison.txt

      - name: Run G2 neutron sidecar thermal Pu-239 second-event-window test
        run: |
          set -euo pipefail
          # Independent event window: 201..400.
          mkdir -p build/g2-pu239-thermal-window201-on
          (
            cd build/g2-pu239-thermal-window201-on
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-pu239-thermal-window201" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 94239 -s 201 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 400 --run-id ci-g2-pu239-thermal-window201 \
              | tee sidecar-summary.txt
          )
          mkdir -p build/g2-pu239-thermal-window201-off
          (
            cd build/g2-pu239-thermal-window201-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 94239 -s 201 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-pu239-thermal-window201-baseline
          (
            cd build/g2-pu239-thermal-window201-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 2.53e-8 -i 94239 -s 201 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-pu239-thermal-window201-on/histories.cgmf.0 build/g2-pu239-thermal-window201-off/histories.cgmf.0
          cmp build/g2-pu239-thermal-window201-on/sidecar-on.stdout build/g2-pu239-thermal-window201-off/sidecar-off.stdout
          cmp build/g2-pu239-thermal-window201-on/rng-audit.tsv build/g2-pu239-thermal-window201-off/rng-audit.tsv
          cmp build/g2-pu239-thermal-window201-on/histories.cgmf.0 build/g2-pu239-thermal-window201-baseline/histories.cgmf.0
          cmp build/g2-pu239-thermal-window201-on/sidecar-on.stdout build/g2-pu239-thermal-window201-baseline/baseline.stdout
          echo "PASS: Pu-239 thermal second event window sidecar off/on RNG and baseline outputs match" \
            | tee build/g2-pu239-thermal-window201-on/off-on-comparison.txt

      - name: Run G2 neutron sidecar neutron-induced Pu-239 0.5 MeV test
        run: |
          set -euo pipefail
          mkdir -p build/g2-pu239-0p5-on
          (
            cd build/g2-pu239-0p5-on
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-pu239-0p5" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 0.5 -i 94239 -s 1 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 200 --run-id ci-g2-pu239-0p5 \
              | tee sidecar-summary.txt
          )
          mkdir -p build/g2-pu239-0p5-off
          (
            cd build/g2-pu239-0p5-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 0.5 -i 94239 -s 1 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-pu239-0p5-baseline
          (
            cd build/g2-pu239-0p5-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 0.5 -i 94239 -s 1 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-pu239-0p5-on/histories.cgmf.0 build/g2-pu239-0p5-off/histories.cgmf.0
          cmp build/g2-pu239-0p5-on/sidecar-on.stdout build/g2-pu239-0p5-off/sidecar-off.stdout
          cmp build/g2-pu239-0p5-on/rng-audit.tsv build/g2-pu239-0p5-off/rng-audit.tsv
          cmp build/g2-pu239-0p5-on/histories.cgmf.0 build/g2-pu239-0p5-baseline/histories.cgmf.0
          cmp build/g2-pu239-0p5-on/sidecar-on.stdout build/g2-pu239-0p5-baseline/baseline.stdout
          echo "PASS: Pu-239 0.5 MeV sidecar off/on RNG and baseline outputs match" \
            | tee build/g2-pu239-0p5-on/off-on-comparison.txt

      - name: Run G2 neutron sidecar neutron-induced Pu-239 10 MeV test
        run: |
          set -euo pipefail
          mkdir -p build/g2-pu239-10mev-on
          (
            cd build/g2-pu239-10mev-on
            CGMF_G2_SIDECAR="$PWD/neutron-transition.jsonl" \
            CGMF_G2_RUN_ID="ci-g2-pu239-10mev" \
            CGMF_RNG_AUDIT=1 \
            CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 10.0 -i 94239 -s 1 -f histories.cgmf \
              > sidecar-on.stdout
            python3 "$GITHUB_WORKSPACE/tools/tests/testG2Sidecar.py" \
              neutron-transition.jsonl --expected-events 200 --run-id ci-g2-pu239-10mev \
              | tee sidecar-summary.txt
          )
          mkdir -p build/g2-pu239-10mev-off
          (
            cd build/g2-pu239-10mev-off
            CGMF_RNG_AUDIT=1 CGMF_RNG_AUDIT_FILE="$PWD/rng-audit.tsv" \
              ../utils/cgmf/cgmf.x -n 200 -e 10.0 -i 94239 -s 1 -f histories.cgmf \
              > sidecar-off.stdout
          )
          mkdir -p build/g2-pu239-10mev-baseline
          (
            cd build/g2-pu239-10mev-baseline
            ../utils/cgmf/cgmf.x -n 200 -e 10.0 -i 94239 -s 1 -f histories.cgmf \
              > baseline.stdout
          )
          cmp build/g2-pu239-10mev-on/histories.cgmf.0 build/g2-pu239-10mev-off/histories.cgmf.0
          cmp build/g2-pu239-10mev-on/sidecar-on.stdout build/g2-pu239-10mev-off/sidecar-off.stdout
          cmp build/g2-pu239-10mev-on/rng-audit.tsv build/g2-pu239-10mev-off/rng-audit.tsv
          cmp build/g2-pu239-10mev-on/histories.cgmf.0 build/g2-pu239-10mev-baseline/histories.cgmf.0
          cmp build/g2-pu239-10mev-on/sidecar-on.stdout build/g2-pu239-10mev-baseline/baseline.stdout
          echo "PASS: Pu-239 10 MeV sidecar off/on RNG and baseline outputs match" \
            | tee build/g2-pu239-10mev-on/off-on-comparison.txt

      - name: Save G2 sidecar smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgmf-g2-sidecar-smoke
          path: |
            build/g2-sidecar-smoke/neutron-transition.jsonl
            build/g2-sidecar-smoke/sidecar-summary.txt
            build/g2-sidecar-smoke/rng-audit.tsv
            build/g2-sidecar-smoke/histories.cgmf.0
            build/g2-sidecar-smoke/sidecar-on.stdout
            build/g2-sidecar-smoke/off-on-comparison.txt
            build/g2-sidecar-off/histories.cgmf.0
            build/g2-sidecar-off/sidecar-off.stdout
            build/g2-sidecar-off/rng-audit.tsv
            build/g2-sidecar-baseline/histories.cgmf.0
            build/g2-sidecar-baseline/baseline.stdout
            build/g2-u235-on/neutron-transition.jsonl
            build/g2-u235-on/sidecar-summary.txt
            build/g2-u235-on/rng-audit.tsv
            build/g2-u235-on/histories.cgmf.0
            build/g2-u235-on/sidecar-on.stdout
            build/g2-u235-on/off-on-comparison.txt
            build/g2-u235-off/histories.cgmf.0
            build/g2-u235-off/sidecar-off.stdout
            build/g2-u235-off/rng-audit.tsv
            build/g2-u235-baseline/histories.cgmf.0
            build/g2-u235-baseline/baseline.stdout
            build/g2-u235-thermal-on/neutron-transition.jsonl
            build/g2-u235-thermal-on/sidecar-summary.txt
            build/g2-u235-thermal-on/rng-audit.tsv
            build/g2-u235-thermal-on/histories.cgmf.0
            build/g2-u235-thermal-on/sidecar-on.stdout
            build/g2-u235-thermal-on/off-on-comparison.txt
            build/g2-u235-thermal-off/histories.cgmf.0
            build/g2-u235-thermal-off/sidecar-off.stdout
            build/g2-u235-thermal-off/rng-audit.tsv
            build/g2-u235-thermal-baseline/histories.cgmf.0
            build/g2-u235-thermal-baseline/baseline.stdout
            build/g2-u235-thermal-seed201-on/neutron-transition.jsonl
            build/g2-u235-thermal-seed201-on/sidecar-summary.txt
            build/g2-u235-thermal-seed201-on/rng-audit.tsv
            build/g2-u235-thermal-seed201-on/histories.cgmf.0
            build/g2-u235-thermal-seed201-on/sidecar-on.stdout
            build/g2-u235-thermal-seed201-on/off-on-comparison.txt
            build/g2-u235-thermal-seed201-off/histories.cgmf.0
            build/g2-u235-thermal-seed201-off/sidecar-off.stdout
            build/g2-u235-thermal-seed201-off/rng-audit.tsv
            build/g2-u235-thermal-seed201-baseline/histories.cgmf.0
            build/g2-u235-thermal-seed201-baseline/baseline.stdout
            build/g2-pu239-thermal-on/neutron-transition.jsonl
            build/g2-pu239-thermal-on/sidecar-summary.txt
            build/g2-pu239-thermal-on/rng-audit.tsv
            build/g2-pu239-thermal-on/histories.cgmf.0
            build/g2-pu239-thermal-on/sidecar-on.stdout
            build/g2-pu239-thermal-on/off-on-comparison.txt
            build/g2-pu239-thermal-off/histories.cgmf.0
            build/g2-pu239-thermal-off/sidecar-off.stdout
            build/g2-pu239-thermal-off/rng-audit.tsv
            build/g2-pu239-thermal-baseline/histories.cgmf.0
            build/g2-pu239-thermal-baseline/baseline.stdout
            build/g2-pu239-thermal-window201-on/neutron-transition.jsonl
            build/g2-pu239-thermal-window201-on/sidecar-summary.txt
            build/g2-pu239-thermal-window201-on/rng-audit.tsv
            build/g2-pu239-thermal-window201-on/histories.cgmf.0
            build/g2-pu239-thermal-window201-on/sidecar-on.stdout
            build/g2-pu239-thermal-window201-on/off-on-comparison.txt
            build/g2-pu239-thermal-window201-off/histories.cgmf.0
            build/g2-pu239-thermal-window201-off/sidecar-off.stdout
            build/g2-pu239-thermal-window201-off/rng-audit.tsv
            build/g2-pu239-thermal-window201-baseline/histories.cgmf.0
            build/g2-pu239-thermal-window201-baseline/baseline.stdout
            build/g2-pu239-0p5-on/neutron-transition.jsonl
            build/g2-pu239-0p5-on/sidecar-summary.txt
            build/g2-pu239-0p5-on/rng-audit.tsv
            build/g2-pu239-0p5-on/histories.cgmf.0
            build/g2-pu239-0p5-on/sidecar-on.stdout
