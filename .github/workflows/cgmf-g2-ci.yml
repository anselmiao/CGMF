name: CGMF G2 Build
# G2 regression workflow: event IDs are per-run; RNG seeds are tracked separately.

on:
  push:
    branches:
      - qi/g2-neutron-transition-history
      - qi/g2-unified-history-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-g2-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dcgmf.tests=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run native CGMF test suite
        run: ctest --test-dir build --output-on-failure

      - name: Run G2 three-layer analysis unit tests (synthetic fixtures)
        run: python3 -m unittest discover -s tools/tests -p 'testG2ThreeLayerAnalysis.py' -v

      - name: Run conditional full-history analysis unit tests (synthetic fixtures)
        run: python3 -m unittest discover -s tools/tests -p 'testG2ConditionalHistoryAnalysis.py' -v

      - name: Run complete G2 neutron and mixed-history sidecar matrix
        run: |
          set -euo pipefail
          python3 tools/tests/runG2SidecarMatrix.py \
            --binary build/utils/cgmf/cgmf.x \
            --matrix tools/tests/g2SidecarMatrix.json \
            --validator tools/tests/testG2Sidecar.py \
            --mixed-validator tools/tests/testG2MixedHistory.py \
            --output-dir build/g2-sidecar-matrix

      - name: Run conditional full-history analysis on representative CI simulations
        run: |
          set -euo pipefail
          mkdir -p build/g2-sidecar-matrix/conditional-analysis
          for case_name in cf252-sf pu239-thermal u235-thermal; do
            python3 tools/analysis/g2ConditionalHistoryAnalysis.py \
              "build/g2-sidecar-matrix/${case_name}/on/mixed-history.jsonl" \
              --output "build/g2-sidecar-matrix/conditional-analysis/${case_name}.json" \
              --excitation-bins-MeV 1,2,4 \
              --permutations 250 \
              --seed 20261119
            python3 tools/analysis/g2ConditionalHistoryAnalysis.py \
              "build/g2-sidecar-matrix/${case_name}/on/mixed-history.jsonl" \
              --output "build/g2-sidecar-matrix/conditional-analysis/${case_name}-spin-parity.json" \
              --excitation-bins-MeV 1,2,4 \
              --permutations 250 \
              --seed 20261119 \
              --include-spin-parity
          done

      - name: Save G2 matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgmf-g2-mixed-history-matrix
          path: |
            build/g2-sidecar-matrix/
          if-no-files-found: warn

      - name: Save build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgmf-build-test-logs
          path: build/Testing/Temporary/
          if-no-files-found: ignore
