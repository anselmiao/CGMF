name: CGMF G2 Build

on:
  push:
    branches:
      - qi/g2-neutron-transition-history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-g2-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dcgmf.tests=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run native CGMF test suite
        run: ctest --test-dir build --output-on-failure

      - name: Run complete G2 neutron sidecar matrix
        run: |
          set -euo pipefail
          python3 tools/tests/runG2SidecarMatrix.py \
            --binary build/utils/cgmf/cgmf.x \
            --matrix tools/tests/g2SidecarMatrix.json \
            --validator tools/tests/testG2Sidecar.py \
            --output-dir build/g2-sidecar-matrix

      - name: Save G2 matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgmf-g2-sidecar-matrix
          path: |
            build/g2-sidecar-matrix/
          if-no-files-found: warn

      - name: Save build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgmf-build-test-logs
          path: build/Testing/Temporary/
          if-no-files-found: ignore
